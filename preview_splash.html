<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StyleLink Splash Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #F2EDF2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #F8F6F8 0%, #F2EDF2 50%, #EDE8EE 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* ── Ring logo ── */
    .ring-container {
      position: relative; width: 90px; height: 90px; margin-bottom: 20px;
      opacity: 0; transform: scale(0.5);
      animation: logoReveal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
    }
    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
      60% { opacity: 1; transform: scale(1.05); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .ring {
      width: 72px; height: 72px; border-radius: 50%;
      position: absolute; top: 9px; left: 9px;
      animation: ringFloat 3s ease-in-out infinite;
      background: conic-gradient(from 135deg, #EF8A8D, #D08CB5, #BF88C1, #D08CB5, #EF8A8D);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    }
    @keyframes ringFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .ring-glow {
      position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
      border-radius: 50%;
      animation: glowPulse 2.5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(210,140,160,0.08); }
      50% { box-shadow: 0 0 24px rgba(210,140,160,0.16); }
    }
    .s-letter {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 600; color: #FA9287;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Brand text ── */
    .brand-text {
      display: flex; align-items: baseline; gap: 0; margin-bottom: 10px;
      opacity: 0; animation: fadeUp 0.8s ease 1.1s forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .brand-style {
      font-size: 34px; font-weight: 800; color: #2A2730; letter-spacing: -0.5px;
    }
    .brand-link {
      font-size: 34px; font-weight: 400; color: #2A2730; letter-spacing: -0.5px;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 13px; color: #999099; letter-spacing: 0.2px; margin-top: 4px;
      opacity: 0; animation: fadeUp 0.8s ease 1.5s forwards;
    }

    /* ── Spinner ── */
    .spinner-wrap {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      opacity: 0; animation: fadeUp 0.6s ease 1.9s forwards;
    }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(210,138,142,0.15);
      border-top-color: #D08A8E;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .skip-hint {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #BBB5BC; letter-spacing: 0.3px;
      opacity: 0; animation: fadeUp 0.6s ease 2.1s forwards;
    }

    /* ── Timer bar ── */
    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #EF8A8D, #BF88C1);
      border-radius: 0 2px 0 0;
      animation: timerProgress 15s linear 2.5s forwards;
      width: 0%;
    }
    @keyframes timerProgress { to { width: 100%; } }

    .replay-btn {
      position: absolute; top: 16px; right: 16px;
      background: rgba(42,39,48,0.04); border: 1px solid rgba(42,39,48,0.06);
      color: #999; border-radius: 50%; width: 36px; height: 36px;
      font-size: 16px; cursor: pointer; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .replay-btn:hover { background: rgba(42,39,48,0.08); color: #555; }
  </style>
</head>
<body>
  <div id="bg">
    <div class="ring-container">
      <div class="ring-glow"></div>
      <div class="ring"></div>
      <div class="s-letter">S</div>
    </div>
    <div class="brand-text">
      <span class="brand-style">Style</span><span class="brand-link">Link</span>
    </div>
    <div class="tagline">Discover and Book Stylists Near You.</div>
    <div class="spinner-wrap"><div class="spinner"></div></div>
    <div class="skip-hint">Tap anywhere to skip</div>
  </div>

  <div class="timer-bar" id="timerBar"></div>
  <button class="replay-btn" id="replayBtn" title="Replay">↻</button>

  <script>
    let skipped = false;
    function skipSplash() {
      if (skipped) return;
      skipped = true;
      const bg = document.getElementById('bg');
      bg.style.transition = 'opacity 0.5s ease';
      bg.style.opacity = '0';
    }
    document.body.addEventListener('click', skipSplash);

    document.getElementById('replayBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      skipped = false;
      const bg = document.getElementById('bg');
      bg.style.opacity = '1';
      document.querySelectorAll('.ring-container, .brand-text, .tagline, .spinner-wrap, .skip-hint').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
      const bar = document.getElementById('timerBar');
      bar.style.animation = 'none';
      bar.offsetHeight;
      bar.style.animation = '';
    });
  </script>
</body>
</html>
