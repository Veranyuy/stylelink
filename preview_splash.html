<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StyleLink Splash Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #FDFBFB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #FDFBFB 0%, #F8F5F3 50%, #F0ECE8 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* ── Ring logo ── */
    .ring-container {
      position: relative; width: 100px; height: 100px; margin-bottom: 24px;
      opacity: 0; transform: scale(0.5);
      animation: logoReveal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
    }
    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
      60% { opacity: 1; transform: scale(1.05); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .ring {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2.5px solid #2EC4B6;
      position: absolute; top: 10px; left: 10px;
      animation: ringFloat 3s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(46,196,182,0.12), 0 0 40px rgba(46,196,182,0.06);
    }
    @keyframes ringFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .ring-glow {
      position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
      border-radius: 50%;
      animation: glowPulse 2.5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(46,196,182,0.1); }
      50% { box-shadow: 0 0 30px rgba(46,196,182,0.2); }
    }
    .s-letter {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 600; color: #FF6B35;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Brand text ── */
    .brand-text {
      display: flex; align-items: baseline; gap: 0; margin-bottom: 12px;
      opacity: 0; animation: fadeUp 0.8s ease 1.1s forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .brand-style {
      font-size: 36px; font-weight: 800; color: #FF6B35; letter-spacing: -0.5px;
    }
    .brand-link {
      font-size: 36px; font-weight: 400; color: #2D2D3A; letter-spacing: -0.5px;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 14px; color: #888; letter-spacing: 0.3px; margin-top: 4px;
      opacity: 0; animation: fadeUp 0.8s ease 1.5s forwards;
    }

    /* ── Spinner ── */
    .spinner-wrap {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      opacity: 0; animation: fadeUp 0.6s ease 1.9s forwards;
    }
    .spinner {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2.5px solid rgba(46,196,182,0.15);
      border-top-color: #2EC4B6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .skip-hint {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #bbb; letter-spacing: 0.5px;
      opacity: 0; animation: fadeUp 0.6s ease 2.1s forwards;
    }

    /* ── Timer bar ── */
    .timer-bar {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #2EC4B6, #FF6B35);
      border-radius: 0 2px 0 0;
      animation: timerProgress 15s linear 2.5s forwards;
      width: 0%;
    }
    @keyframes timerProgress { to { width: 100%; } }

    .replay-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06);
      color: #999; border-radius: 50%; width: 40px; height: 40px;
      font-size: 18px; cursor: pointer; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .replay-btn:hover { background: rgba(0,0,0,0.08); color: #555; }

    /* ── Onboarding ── */
    #onboarding {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #FDFBFB; z-index: 30;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.6s ease;
    }
    #onboarding.show { display: flex; opacity: 1; }
    .onb-page { text-align: center; padding: 40px; animation: fadeUp 0.8s ease forwards; }
    .onb-circle {
      width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 32px;
      display: flex; align-items: center; justify-content: center;
    }
    .onb-circle.teal { background: linear-gradient(135deg, #2EC4B6, #3AAFA9); }
    .onb-icon { font-size: 64px; }
    .onb-title { font-size: 24px; font-weight: 700; color: #2D2D3A; margin-bottom: 12px; }
    .onb-desc { font-size: 16px; color: #888; line-height: 1.6; max-width: 300px; margin: 0 auto; }
    .onb-dots { display: flex; gap: 8px; margin-top: 40px; }
    .onb-dot { width: 8px; height: 8px; border-radius: 4px; background: #E0E0E0; transition: all 0.3s; }
    .onb-dot.active { width: 24px; background: #2EC4B6; }
  </style>
</head>
<body>
  <div id="bg">
    <div class="ring-container">
      <div class="ring-glow"></div>
      <div class="ring"></div>
      <div class="s-letter">S</div>
    </div>
    <div class="brand-text">
      <span class="brand-style">Style</span><span class="brand-link">Link</span>
    </div>
    <div class="tagline">Discover and Book Stylists Near You.</div>
    <div class="spinner-wrap"><div class="spinner"></div></div>
    <div class="skip-hint">Tap anywhere to skip</div>
  </div>

  <div class="timer-bar" id="timerBar"></div>
  <button class="replay-btn" id="replayBtn" title="Replay">↻</button>

  <div id="onboarding">
    <div class="onb-page">
      <div class="onb-circle teal"><span class="onb-icon">✂️</span></div>
      <div class="onb-title">Find Your Stylist</div>
      <div class="onb-desc">Discover top-rated barbers, hair stylists, and beauty professionals near you.</div>
    </div>
    <div class="onb-dots">
      <div class="onb-dot active"></div>
      <div class="onb-dot"></div>
      <div class="onb-dot"></div>
    </div>
  </div>

  <script>
    let skipped = false;
    function skipSplash() {
      if (skipped) return;
      skipped = true;
      const bg = document.getElementById('bg');
      bg.style.transition = 'opacity 0.5s ease';
      bg.style.opacity = '0';
      setTimeout(() => {
        bg.style.display = 'none';
        const ob = document.getElementById('onboarding');
        ob.style.display = 'flex';
        requestAnimationFrame(() => { ob.style.opacity = '1'; });
      }, 500);
    }
    document.body.addEventListener('click', skipSplash);

    document.getElementById('replayBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      skipped = false;
      const bg = document.getElementById('bg');
      const ob = document.getElementById('onboarding');
      ob.style.opacity = '0';
      ob.style.display = 'none';
      bg.style.display = 'flex';
      bg.style.opacity = '1';
      // Re-trigger animations
      document.querySelectorAll('.ring-container, .brand-text, .tagline, .spinner-wrap, .skip-hint').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
      const bar = document.getElementById('timerBar');
      bar.style.animation = 'none';
      bar.offsetHeight;
      bar.style.animation = '';
    });
  </script>
</body>
</html>
