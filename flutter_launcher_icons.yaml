# StyleLink launcher icon configuration (official coral→purple branding).
#
# Master sources are generated by `tool/generate_brand_assets.py`:
#   assets/images/icon_app.png         full-bleed 1024 icon (off-white bg)
#   assets/images/icon_foreground.png  adaptive foreground (transparent)
#
# Regenerate everything with:
#   dart run flutter_launcher_icons          # platform icons (this config)
#   python tool/generate_brand_assets.py     # master sources (same palette)
flutter_launcher_icons:
  image_path: "assets/images/icon_app.png"

  android: "ic_launcher"
  adaptive_icon_background: "#FDFBF7"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/images/icon_app.png"
    background_color: "#FDFBF7"
    theme_color: "#FA5252"
